<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12 - 0 a 1000 de 10 em 10</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        button { padding: 10px 20px; background: #009688; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #00796B; }
        #resultado { margin-top: 20px; padding: 15px; background: white; border-radius: 5px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Exercício 12 - Números de 0 até 1000 de 10 em 10</h1>
    <button onclick="mostrar()">Mostrar Números</button>
    <div id="resultado"></div>

    <script>
        function mostrar() {
            let numeros = [];
            for (let i = 0; i <= 1000; i += 10) {
                numeros.push(i);
            }
            document.getElementById("resultado").innerHTML = 
                `<p><strong>Números de 0 a 1000 (de 10 em 10):</strong></p>
                 <p>${numeros.join(", ")}</p>
                 <p>Total: ${numeros.length} números.</p>`;
            
            // Também no console
            console.log(numeros.join(", "));
        }
    </script>
</body>
</html>
