<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 15 - Cofre / Cofrinho</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        button { padding: 10px 20px; background: #FFC107; color: #333; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #FFB300; }
        #resultado { margin-top: 20px; padding: 15px; background: white; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #FFC107; }
    </style>
</head>
<body>
    <h1>Exercício 15 - Valor acumulado no cofrinho após 12 dias</h1>
    <p>Dia 1: R$ 2,00</p>
    <p>Dia 2: R$ 4,00</p>
    <p>Dia 3: R$ 6,00</p>
    <p>Sempre aumentando R$ 2,00 a cada dia.</p>
    <button onclick="calcular()">Calcular</button>
    <div id="resultado"></div>

    <script>
        function calcular() {
            let total = 0;
            let deposito = 2; // começa com 2 no dia 1
            let html = "<table><tr><th>Dia</th><th>Depósito (R$)</th><th>Acumulado (R$)</th></tr>";

            for (let dia = 1; dia <= 12; dia++) {
                total += deposito;
                html += `<tr><td>${dia}</td><td>${deposito.toFixed(2)}</td><td>${total.toFixed(2)}</td></tr>`;
                deposito += 2; // aumenta 2 a cada dia
            }

            html += "</table>";
            html += `<p style="font-size:18px; color:green; margin-top:15px;"><strong>Valor total acumulado após 12 dias: R$ ${total.toFixed(2)}</strong></p>`;

            document.getElementById("resultado").innerHTML = html;
        }
    </script>
</body>
</html>
