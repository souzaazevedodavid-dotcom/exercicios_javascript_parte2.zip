<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - População Nigéria vs China</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        button { padding: 10px 20px; background: #9C27B0; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #7B1FA2; }
        #resultado { margin-top: 20px; padding: 15px; background: white; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #9C27B0; color: white; }
    </style>
</head>
<body>
    <h1>Exercício 4 - População Nigéria vs China</h1>
    <p>Nigéria: 195,9 milhões | Crescimento: 3,8% ao ano</p>
    <p>China: 1.393 milhões | Crescimento: 0,37% ao ano</p>
    <button onclick="calcularPopulacao()">Calcular até Nigéria ultrapassar China</button>
    <div id="resultado"></div>

    <script>
        function calcularPopulacao() {
            let nigeria = 195.9; // milhões
            let china = 1393; // milhões
            let taxaNigeria = 0.038;
            let taxaChina = 0.0037;
            let anos = 0;
            let html = "<table><tr><th>Ano</th><th>Nigéria (milhões)</th><th>China (milhões)</th></tr>";

            html += `<tr><td>0 (inicial)</td><td>${nigeria.toFixed(2)}</td><td>${china.toFixed(2)}</td></tr>`;

            while (nigeria <= china) {
                nigeria *= (1 + taxaNigeria);
                china *= (1 + taxaChina);
                anos++;
                html += `<tr><td>${anos}</td><td>${nigeria.toFixed(2)}</td><td>${china.toFixed(2)}</td></tr>`;
                
                // Segurança para não travar
                if (anos > 500) {
                    document.getElementById("resultado").innerHTML = "<p style='color:red'>Limite de anos atingido (500). Verifique os dados.</p>";
                    return;
                }
            }

            html += "</table>";
            html += `<p style="margin-top:15px; font-size:18px; color:green;"><strong>A Nigéria ultrapassará a China em ${anos} anos!</strong></p>`;
            html += `<p>População final Nigéria: ${nigeria.toFixed(2)} milhões</p>`;
            html += `<p>População final China: ${china.toFixed(2)} milhões</p>`;

            document.getElementById("resultado").innerHTML = html;
        }
    </script>
</body>
</html>
