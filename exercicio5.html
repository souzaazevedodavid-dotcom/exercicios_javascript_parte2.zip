<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5 - Corrida de Carros</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; background: #f5f5f5; }
        h1 { color: #333; }
        button { padding: 10px 20px; background: #E91E63; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #C2185B; }
        #resultado { margin-top: 20px; padding: 15px; background: white; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        .volta { padding: 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>Exercício 5 - Corrida entre Dois Carros</h1>
    <p>Carro 1 inicia com 10 km/h e ganha 3 km/h por volta.</p>
    <p>Carro 2 inicia com 20 km/h e ganha 1,5 km/h por volta.</p>
    <button onclick="simularCorrida()">Simular Corrida</button>
    <div id="resultado"></div>

    <script>
        function simularCorrida() {
            let velCarro1 = 10;
            let velCarro2 = 20;
            let volta = 0;
            let html = "";

            // Imprime velocidades iniciais
            html += `<div class="volta"><strong>Início:</strong> Carro 1: ${velCarro1.toFixed(1)} km/h | Carro 2: ${velCarro2.toFixed(1)} km/h</div>`;

            while (velCarro1 <= velCarro2) {
                volta++;
                velCarro1 += 3;
                velCarro2 += 1.5;
                html += `<div class="volta"><strong>Volta ${volta}:</strong> Carro 1: ${velCarro1.toFixed(1)} km/h | Carro 2: ${velCarro2.toFixed(1)} km/h</div>`;
            }

            html += `<p style="margin-top:15px; font-size:18px; color:green;"><strong>O Carro 1 ultrapassou o Carro 2 na volta ${volta}!</strong></p>`;
            html += `<p>Velocidade final Carro 1: ${velCarro1.toFixed(1)} km/h</p>`;
            html += `<p>Velocidade final Carro 2: ${velCarro2.toFixed(1)} km/h</p>`;
            html += `<p><strong>Total de voltas: ${volta}</strong></p>`;

            document.getElementById("resultado").innerHTML = html;
        }
    </script>
</body>
</html>
